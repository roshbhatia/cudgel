version: '3'

vars:
  PROJECT_NAME: cudgel

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development
  build:
    desc: Build the project (release mode)
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test

  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  clippy:
    desc: Run linter
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Quick check (no codegen)
    cmds:
      - cargo check

  # Installation
  install:
    desc: Install cudgel globally
    cmds:
      - cargo install --path .

  teardown:
    desc: Complete teardown (opposite of setup - removes everything)
    prompt: This will stop PostgreSQL, remove all data, and uninstall cudgel. Continue?
    cmds:
      - echo "Stopping PostgreSQL..."
      - task db-stop || true
      - echo "Removing data directories (respecting XDG env vars)..."
      - |
        # Respect XDG environment variables
        XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
        XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
        XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
        rm -rf "$XDG_DATA_HOME/cudgel" || true
        rm -rf "$XDG_STATE_HOME/cudgel" || true
        rm -rf "$XDG_CACHE_HOME/cudgel" || true
        echo "✓ Removed XDG directories"
      - echo "Uninstalling cudgel binary..."
      - rm ~/.cargo/bin/cudgel 2>/dev/null || true
      - echo "Cleaning build artifacts..."
      - cargo clean
      - echo "✓ Teardown complete - system is clean"

  run:
    desc: "Run cudgel (usage: task run -- index .)"
    cmds:
      - cargo run --release -- {{.CLI_ARGS}}

  # Setup
  setup:
    desc: Build, install, start database, and initialize schema
    cmds:
      - echo "Building cudgel..."
      - cargo build --release
      - echo "Installing cudgel..."
      - cargo install --path .
      - echo "Starting PostgreSQL on port 54321..."
      - ./scripts/start-postgres.sh
      - echo "Initializing database schema..."
      - cudgel init-db
      - echo "Setup complete!"
      - echo ""
      - echo "PostgreSQL is running on localhost:54321"
      - echo "Data directory:" $HOME/.local/share/cudgel/postgres
      - echo "Logs:" $HOME/.local/share/cudgel/postgres.log

  # Database (native PostgreSQL)
  db-start:
    desc: Start native PostgreSQL on port 54321
    cmds:
      - ./scripts/start-postgres.sh

  db-stop:
    desc: Stop PostgreSQL
    cmds:
      - ./scripts/stop-postgres.sh

  db-status:
    desc: Check PostgreSQL status
    cmds:
      - |
        if [ -d "/opt/homebrew/opt/postgresql@17/bin" ]; then
          /opt/homebrew/opt/postgresql@17/bin/pg_isready -p 54321 -h localhost && echo "PostgreSQL is running" || echo "PostgreSQL is not running"
        elif [ -d "/opt/homebrew/opt/postgresql@16/bin" ]; then
          /opt/homebrew/opt/postgresql@16/bin/pg_isready -p 54321 -h localhost && echo "PostgreSQL is running" || echo "PostgreSQL is not running"
        else
          pg_isready -p 54321 -h localhost && echo "PostgreSQL is running" || echo "PostgreSQL is not running"
        fi

  db-clean:
    desc: Remove PostgreSQL data directory
    cmds:
      - ./scripts/stop-postgres.sh
      - rm -rf ~/.cudgel/postgres
      - echo "PostgreSQL data removed"

  init-db:
    desc: Initialize database schema
    cmds:
      - cudgel init-db
