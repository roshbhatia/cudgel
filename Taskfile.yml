version: '3'

vars:
  PROJECT_NAME: cudgel

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Development
  build:
    desc: Build the project (release mode)
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test

  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  clippy:
    desc: Run linter
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Quick check (no codegen)
    cmds:
      - cargo check

  # Installation
  install:
    desc: Install cudgel globally
    cmds:
      - cargo install --path .

  teardown:
    desc: Complete teardown (opposite of setup - removes everything)
    prompt: This will stop PostgreSQL, remove all data, and uninstall cudgel. Continue?
    cmds:
      - echo "Stopping PostgreSQL..."
      - task db-stop || true
      - echo "Removing data directories (respecting XDG env vars)..."
      - |
        # Respect XDG environment variables
        XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
        XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
        XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
        rm -rf "$XDG_DATA_HOME/cudgel" || true
        rm -rf "$XDG_STATE_HOME/cudgel" || true
        rm -rf "$XDG_CACHE_HOME/cudgel" || true
        echo "✓ Removed XDG directories"
      - echo "Uninstalling cudgel binary..."
      - rm ~/.cargo/bin/cudgel 2>/dev/null || true
      - echo "Cleaning build artifacts..."
      - cargo clean
      - echo "✓ Teardown complete - system is clean"

  run:
    desc: "Run cudgel (usage: task run -- index .)"
    cmds:
      - cargo run --release -- {{.CLI_ARGS}}

  # Setup
  setup:
    desc: Build, install, start database, and initialize schema
    cmds:
      - echo "Building cudgel..."
      - cargo build --release
      - echo "Installing cudgel..."
      - cargo install --path .
      - echo "Starting PostgreSQL..."
      - ./scripts/start-postgres.sh
      - echo "Initializing database schema..."
      - cudgel init-db
      - echo "Setup complete!"
      - echo ""
      - echo "PostgreSQL is running on localhost:${CUDGEL_POSTGRES_PORT:-45678}"
      - echo "Data directory:" $HOME/.local/share/cudgel/postgres
      - echo "Logs:" $HOME/.local/share/cudgel/postgres.log

  # Database (native PostgreSQL)
  db-start:
    desc: Start native PostgreSQL
    cmds:
      - ./scripts/start-postgres.sh

  db-stop:
    desc: Stop PostgreSQL
    cmds:
      - ./scripts/stop-postgres.sh

  db-status:
    desc: Check PostgreSQL status
    cmds:
      - |
        PGPORT=${CUDGEL_POSTGRES_PORT:-45678}
        pg_isready -p $PGPORT -h localhost && echo "PostgreSQL is running on port $PGPORT" || echo "PostgreSQL is not running"

  health:
    desc: Check development environment health
    cmds:
      - |
        echo "Checking development environment..."
        echo ""
        PASS="\033[0;32m✓\033[0m"
        FAIL="\033[0;31m✗\033[0m"
        WARN="\033[0;33m⚠\033[0m"

        # PostgreSQL
        PGPORT=${CUDGEL_POSTGRES_PORT:-45678}
        if pg_isready -p $PGPORT -h localhost > /dev/null 2>&1; then
          echo -e "$PASS PostgreSQL (port $PGPORT)"
        else
          echo -e "$FAIL PostgreSQL (port $PGPORT) - not running"
        fi

        # ONNX model
        MODEL_FILE="$HOME/.local/share/cudgel/models/all-MiniLM-L6-v2/model.onnx"
        if [ -f "$MODEL_FILE" ]; then
          echo -e "$PASS ONNX embedding model"
        else
          echo -e "$WARN ONNX model - not found (will download on first use)"
        fi

        # Rust toolchain
        if command -v rustc > /dev/null 2>&1; then
          echo -e "$PASS Rust toolchain ($(rustc --version | cut -d' ' -f2))"
        else
          echo -e "$FAIL Rust toolchain - not found"
        fi

        # Cudgel binary
        if command -v cudgel > /dev/null 2>&1; then
          echo -e "$PASS cudgel binary installed"
        else
          echo -e "$WARN cudgel binary - not installed (run 'task install')"
        fi

        # Ollama (optional, for US3)
        if command -v ollama > /dev/null 2>&1; then
          echo -e "$PASS ollama (optional, for knowledge generation)"
        else
          echo -e "$WARN ollama - not installed (optional)"
        fi

  db-clean:
    desc: Remove PostgreSQL data directory
    cmds:
      - ./scripts/stop-postgres.sh
      - rm -rf ~/.cudgel/postgres
      - echo "PostgreSQL data removed"

  init-db:
    desc: Initialize database schema
    cmds:
      - cudgel init-db
