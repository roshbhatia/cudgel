version: '3'

vars:
  PROJECT_NAME: cudgel

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the project (release mode)
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test

  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  clippy:
    desc: Run linter
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Quick check (no codegen)
    cmds:
      - cargo check

  install:
    desc: Install cudgel globally
    cmds:
      - cargo install --path .

  deps:
    desc: Install all dependencies (models, database, schema) via cudgel deps
    cmds:
      - cargo run --release -- deps

  deps-check:
    desc: Check dependency status without installing
    cmds:
      - cargo run --release -- deps --check

  teardown:
    desc: Complete teardown - removes all data and uninstalls cudgel
    prompt: This will stop PostgreSQL, remove all data, and uninstall cudgel. Continue?
    cmds:
      - echo "Cleaning all dependencies..."
      - cargo run --release -- deps --clean-all || true
      - echo "Uninstalling cudgel binary..."
      - rm ~/.cargo/bin/cudgel 2>/dev/null || true
      - echo "Cleaning build artifacts..."
      - cargo clean
      - echo "✓ Teardown complete - system is clean"

  run:
    desc: "Run cudgel (usage: task run -- index .)"
    cmds:
      - cargo run --release -- {{.CLI_ARGS}}
