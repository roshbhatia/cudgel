[package]
name = "cudgel"
version = "0.1.0"
edition = "2021"
authors = ["Cudgel Team"]
description = "A code indexing tool with tree-sitter and PostgreSQL/pgvector"
license = "MIT"
repository = "https://github.com/your-org/cudgel"

[[bin]]
name = "cudgel"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = { version = "0.18", features = ["tokio"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
async-trait = "0.1"

# Database
postgres-types = "0.2"
deadpool-postgres = "0.14"
pgvector = { version = "0.4", features = ["postgres"] }

# Tree-sitter
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-java = "0.21"

# Embeddings - using ort (ONNX Runtime) for sentence transformers
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
tokenizers = "0.19"
ndarray = "0.15"

# Fallback tokenization dependencies
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand_chacha = "0.3"
unicode-segmentation = "1.11"

# HuggingFace Hub for model downloads
hf-hub = { version = "0.4", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
walkdir = "2.5"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
git2 = "0.18"

# LLM for knowledge generation (User Story 3)
ollama-rs = "0.2"

# Knowledge graph database
surrealdb = "1.0"

# Fuzzy matching and pattern matching
strsim = "0.11"
regex = "1.10"

# Pretty output
comfy-table = "7.1"
syntect = "5.2"

# Unix process management (conditional dependency)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
